<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>L’Oréal | AI Beauty Assistant</title>
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="page-wrapper">
      <!------- Header / Branding ------->
      <header class="site-header">
        <img
          class="site-logo"
          src="img/loreal-logo.png"
          alt="L’Oréal Paris"
        />
        <p class="site-title">Smart Routine &amp; Product Advisor</p>

        <nav class="site-nav" aria-label="L’Oréal Paris">
          <a href="https://www.lorealparisusa.com/">Home</a>
          <a href="https://www.lorealparisusa.com/skin-care">Skincare</a>
          <a href="https://www.lorealparisusa.com/makeup">Makeup</a>
        </nav>
      </header>

      <!------- Chat Area ------->
      <main>
        <section class="chatbox">
          <!-- LevelUp: Conversation-style chat window -->
          <div
            id="chatWindow"
            class="chat-window"
            role="log"
            aria-label="Chat conversation"
            aria-live="polite"
            aria-relevant="additions text"
          >
            <!-- Chat bubbles are added using JavaScript -->
          </div>

          <!-- User input -->
          <form id="chatForm" class="chat-form">
            <label for="userInput" class="visually-hidden">
              Message
            </label>

            <input
              id="userInput"
              name="userInput"
              type="text"
              placeholder="Ask about beauty products or routines..."
              autocomplete="off"
              maxlength="2000"
              required
            />

            <button type="submit" id="sendBtn">
              <span class="material-icons">send</span>
              <span class="visually-hidden">Send</span>
            </button>
          </form>
        </section>
      </main>

      <!------- Footer Links ------->
      <footer class="site-footer">
        <p>&copy; 2026 L&rsquo;Oréal Beauty Assistant | Student Project</p>
        <p class="site-footer-disclaimer">
          An independent educational project. Not affiliated with or endorsed
          by L&rsquo;Oréal.
        </p>
        <nav aria-label="Official L’Oréal Paris links">
          <span>Official L&rsquo;Oréal Paris website:</span>
          <a
            href="https://www.lorealparisusa.com/"
            target="_blank"
            rel="noopener noreferrer"
          >
            Home
          </a>
          <a
            href="https://www.lorealparisusa.com/privacy-policy"
            target="_blank"
            rel="noopener noreferrer"
          >
            Privacy Policy
          </a>
          <a
            href="https://www.lorealparisusa.com/contact-us"
            target="_blank"
            rel="noopener noreferrer"
          >
            Contact
          </a>
        </nav>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
